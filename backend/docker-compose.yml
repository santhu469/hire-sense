services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hiresense
      POSTGRES_PASSWORD: hiresense
      POSTGRES_DB: hiresense
    ports:
      # Host port 5433, not 5432 -- avoids colliding with any Postgres
      # already running natively on the host.
      - "5433:5432"
    volumes:
      - hiresense_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiresense"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    environment:
      SERVICES: s3,sqs
      DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - hiresense_localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack-init:
    image: amazon/aws-cli:2.17.62
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command:
      - -c
      - |
        aws --endpoint-url=http://localstack:4566 s3 mb s3://hiresense-resumes-dev
        aws --endpoint-url=http://localstack:4566 sqs create-queue --queue-name hiresense-evaluation-jobs-dev

volumes:
  hiresense_pg_data:
  hiresense_localstack_data:
